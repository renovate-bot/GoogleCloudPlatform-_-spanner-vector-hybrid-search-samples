# Google App Engine Flexible Environment Configuration
# Custom Docker runtime for Cloud Spanner Deployment Explorer

runtime: custom
env: flex

manual_scaling:
  instances: 1

resources:
  cpu: 2
  memory_gb: 4
  disk_size_gb: 10

env_variables:
  HOST: "0.0.0.0"
  RELOAD: "false"
  # Benchmarking and AI Advisor are explicitly disabled when deployed to App Engine
  ENABLE_LOAD_TESTING: "false"
  ENABLE_AI: "false"

