# Server
server.port=8000
spring.application.name=spanner-splits-manager

# SQLite (local staging DB; sibling to working directory, mirrors python/sqlite.db)
spring.datasource.url=jdbc:sqlite:${SQLITE_PATH:sqlite.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-test-query=SELECT 1

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.karthitect=INFO
logging.pattern.console=%clr(%-5p) %m%n

# Spanner connection (falls back when DB settings aren't set; reads same env vars as python app)
spanner.project=${PROJECT:${SPANNER_PROJECT:}}
spanner.instance=${SPANNER_INSTANCE:${INSTANCE:}}
spanner.database=${SPANNER_DATABASE:${DATABASE:}}
